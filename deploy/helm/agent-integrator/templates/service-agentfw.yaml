apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agentfw
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-integrator
    app.kubernetes.io/component: agentfw
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-integrator
    app.kubernetes.io/component: agentfw
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
