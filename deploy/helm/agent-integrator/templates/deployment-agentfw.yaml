apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agentfw
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-integrator
    app.kubernetes.io/component: agentfw
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.agentfw.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-integrator
      app.kubernetes.io/component: agentfw
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-integrator
        app.kubernetes.io/component: agentfw
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: agentfw
          image: "agent-integrator/agentfw:{{ .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AGENTFW_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: AGENTFW_AUDIENCE
            - name: AGENTFW_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: AGENTFW_UPSTREAM
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
