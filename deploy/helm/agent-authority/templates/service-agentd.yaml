apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agentd
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-authority
    app.kubernetes.io/component: agentd
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-authority
    app.kubernetes.io/component: agentd
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8443
      targetPort: http
      protocol: TCP
