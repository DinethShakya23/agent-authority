apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-authority
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  IDP_TYPE: {{ .Values.idp.type | quote }}
  IDP_WELL_KNOWN: {{ .Values.idp.wellKnown | quote }}
  IDP_AUDIENCE: {{ .Values.idp.audience | quote }}
  AGENTFW_AUDIENCE: {{ .Values.idp.audience | quote }}
  AGENTFW_UPSTREAM: {{ printf "http://%s-mock-sap:9090" .Release.Name | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.telemetry.otlpEndpoint | quote }}
  SCIM2_ENABLED: {{ .Values.idp.scim2.enabled | quote }}
  SCIM2_ENDPOINT: {{ .Values.idp.scim2.endpoint | quote }}
