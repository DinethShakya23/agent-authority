agentd:
  replicas: 1            # HA with etcd lands in v0.2
  persistence: { enabled: true, size: 1Gi }
agentfw:
  replicas: 2            # minimum 2 to exercise the lease protocol
  autoscaling: { enabled: false }
idp:
  # External OIDC-compliant IdP (WSO2, Auth0, Okta, Keycloak, etc.).
  # The federation adapter connects to whatever the operator configures.
  type: oidc
  wellKnown: ""
  audience: agent-authority
  scim2:
    enabled: false
    endpoint: ""
ca:
  provider: cert-manager
telemetry:
  otlpEndpoint: http://otel-collector:4317
