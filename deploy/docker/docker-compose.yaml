name: agent-authority
  # Identity provider is external (any OIDC-compliant SaaS IdP).
  # The federation adapter connects to whatever IdP the operator configures
  # via IDP_WELL_KNOWN. WSO2, Auth0, Okta, Keycloak all work out of the box.

services:
  step-ca:
    image: smallstep/step-ca:latest
    ports: ["9000:9000"]
    volumes:
      - ./stepca/ca.json:/home/step/config/ca.json:ro
      - stepca-data:/home/step
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agentd:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.agentd }
    depends_on:
      step-ca: { condition: service_healthy }
    ports: ["8443:8443"]
    environment:
      - AGENTD_DB_PATH=/var/lib/agentd/state.db
      - IDP_TYPE=${IDP_TYPE:-oidc}
      - IDP_WELL_KNOWN=${IDP_WELL_KNOWN:-}
      - IDP_AUDIENCE=${IDP_AUDIENCE:-agent-authority}
      - SCIM2_ENABLED=${SCIM2_ENABLED:-false}
      - SCIM2_ENDPOINT=${SCIM2_ENDPOINT:-}
      - SCIM2_CREDENTIALS_REF=${SCIM2_CREDENTIALS_REF:-}
      - SCIM2_SYNC_INTERVAL=${SCIM2_SYNC_INTERVAL:-5m}
    volumes:
      - agentd-data:/var/lib/agentd
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8443/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agentfw-1:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.agentfw }
    depends_on:
      agentd: { condition: service_healthy }
      mock-sap: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      - REPLICA_ID=fw-1
      - AGENTFW_AUDIENCE=https://localhost:8443
      - AGENTFW_UPSTREAM=http://mock-sap:9090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agentfw-2:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.agentfw }
    depends_on:
      agentd: { condition: service_healthy }
      mock-sap: { condition: service_healthy }
    ports: ["8081:8080"]
    environment:
      - REPLICA_ID=fw-2
      - AGENTFW_AUDIENCE=https://localhost:8443
      - AGENTFW_UPSTREAM=http://mock-sap:9090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mock-sap:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.mocksap }
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14250:14250"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  agentd-data: {}
  stepca-data: {}

# Two firewall replicas are required: the lease protocol is only exercised
# when budget is shared across more than one enforcement point.
