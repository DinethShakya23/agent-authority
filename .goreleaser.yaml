version: 2
builds:
  - id: agentd
    main: ./cmd/agentd
    binary: agentd
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: agentfw
    main: ./cmd/agentfw
    binary: agentfw
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: agentctl
    main: ./cmd/agentctl
    binary: agentctl
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
checksum: { name_template: 'checksums.txt' }
