name: fuzz
on:
  schedule: [{ cron: '0 3 * * *' }]
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go test -fuzz=Fuzz -fuzztime=10m ./pkg/crypto/...
      - run: go test -fuzz=Fuzz -fuzztime=10m ./pkg/passport/...
